name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m catalog.validate
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: ruff check catalog tests
      - run: python -m catalog.build
      - name: Verify compiled files are committed
        run: git diff --exit-code -- dist public
